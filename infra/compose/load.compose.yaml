# The whole app on one machine, for the load and crash tests. Nothing in it calls a cloud service: our own PostGIS
# (filled by the importer), our own Valhalla, and stand-ins for Photon and the Bluebikes feed. tools/load-tests.py
# drives it (it sets the CPU sets and builds the images); ports are bound to 127.0.0.1 only.
#
# Toxiproxy sits between the services and what they depend on (the database, Valhalla, the Bluebikes feed), so a
# scenario can slow or cut each one. Memory limits follow the plan's local budget.
name: placemap-load

# Metrics go to the stack's own Prometheus every 5 s; traces and logs stay in the containers.
x-telemetry: &telemetry
  PLACEMAP_ENV: load
  JAVA_TOOL_OPTIONS: ${PLACEMAP_JAVA_OPTIONS:-}   # extra JVM flags for a diagnosis, e.g. -XX:+PrintClassHistogram
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://prometheus:9090/api/v1/otlp/v1/metrics
  MANAGEMENT_OTLP_METRICS_EXPORT_STEP: 5s
  MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "false"
  MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED: "false"

services:
  postgis:
    image: placemap/postgis-test           # the crash tests' image: PostGIS and h3 on Postgres 18, amd64 and arm64
    build: ../docker/postgis
    environment:
      POSTGRES_PASSWORD: load              # a throwaway database reachable only from this machine
      POSTGRES_DB: placemap
    command: >-
      postgres -c shared_buffers=384MB -c effective_cache_size=1GB -c work_mem=16MB -c max_connections=60
      -c jit=off -c random_page_cost=1.1
    shm_size: 256m
    mem_limit: 1536m
    cpuset: ${PLACEMAP_SUT_CPUS:?set by tools/load-tests.py}
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "127.0.0.1:55440:5432"             # the seed's importer and the driver's checks
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "placemap"]
      interval: 2s
      retries: 60

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.1@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de
    command: ["bash", "/serve.sh", "4"]   # 4 threads; settings for 1×200 matrices in 1 GB
    mem_limit: 1g
    cpuset: ${PLACEMAP_SUT_CPUS}
    volumes:
      - ../../data/valhalla:/data:ro       # tools/build-valhalla-tiles.sh
      - ../docker/valhalla/serve.sh:/serve.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8002/status"]
      interval: 2s
      retries: 60

  standins:
    image: python:3.14.7-slim@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
    # Vehicles at MBTA's weekday rate: 818 at the morning peak, and at midday 79% of them (up to 88%) changed between
    # two 15 s polls, so each reports every 18 s here (83%).
    command: ["python3", "-I", "/standins/standins.py", "--stations", "/seed/stations.txt",
              "--changes-per-second", "5", "--vehicles", "818", "--vehicle-period", "18",
              "--vehicle-inner-share", "0.8"]
    mem_limit: 128m
    cpuset: ${PLACEMAP_SUT_CPUS}
    volumes:
      - ../../load/standins:/standins:ro
      - ../../data/load:/seed:ro           # the station ids the seed wrote
    ports:
      - "127.0.0.1:58089:8080"             # its control endpoint, for scenarios that step the vehicle rate
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      retries: 30

  # Photon's search, answering every address with no match: no load scenario searches addresses, and during the seed
  # an unplaced address simply stays unplaced.
  photon:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    command: ["--disable-banner", "--no-request-journal", "--disable-request-logging"]
    mem_limit: 256m
    cpuset: ${PLACEMAP_LOAD_CPUS:?set by tools/load-tests.py}   # idle during the scenarios; off the services' CPUs
    volumes:
      - ../../load/standins/photon.json:/home/wiremock/mappings/photon.json:ro
    ports:
      - "127.0.0.1:58088:8080"             # the seed's importer geocodes against it
    healthcheck:                           # the image's own check, run sooner
      interval: 2s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    mem_limit: 128m
    cpuset: ${PLACEMAP_SUT_CPUS}
    volumes:
      - ./load/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:58474:8474"             # its API, for the scenarios' faults

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    mem_limit: 768m
    cpuset: ${PLACEMAP_LOAD_CPUS:?set by tools/load-tests.py}   # with the load generators, not the services tested
    volumes:
      - ../observability/prometheus/load.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:59090:9090"

  live-hub:
    image: placemap/live-hub:load
    build:
      context: ../../services/live-hub/target
      dockerfile: ../../../infra/docker/java-service/Dockerfile
      args:
        JAR: live-hub.jar
    environment:
      <<: *telemetry
      PLACEMAP_LIVE_THREADS: ${PLACEMAP_LIVE_THREADS:-virtual}            # or pool, for L8
      PLACEMAP_LIVE_BLUEBIKES_URL: http://toxiproxy:18080/gbfs/en/station_status.json
      PLACEMAP_LIVE_BLUEBIKES_MININTERVAL: 1s                            # the stand-in's ttl is 1 s
      # 5,000 streams keep about 480 MiB live; a 60% heap (614 MiB) holds that and leaves the native part (~300 MiB)
      # room under the limit, where G1 growing a 70% heap kept the container at its limit. Two malloc arenas instead of
      # one per core trim the native part further.
      HEAP_PERCENT: "60"
      MALLOC_ARENA_MAX: "2"
      # MBTA's open files from the stand-in (no key, so polled every 15 s: the burstiest way vehicles arrive), through
      # Toxiproxy for the stale check; the static GTFS straight from it.
      PLACEMAP_LIVE_MBTA_REALTIMEURL: http://toxiproxy:18081/realtime/
      PLACEMAP_LIVE_MBTA_GTFSURL: http://standins:8080/MBTA_GTFS.zip
    mem_limit: 1g
    cpuset: ${PLACEMAP_SUT_CPUS}
    ulimits:
      nofile: 65536                        # every stream is a socket
    ports:
      - "127.0.0.1:58081:8081"
    depends_on:
      toxiproxy: {condition: service_started}
    healthcheck:
      # The JRE image has no curl or wget; bash speaks enough HTTP for this.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 2s
      retries: 60

  api:
    image: placemap/api:load
    build:
      context: ../../services/api/target
      dockerfile: ../../../infra/docker/java-service/Dockerfile
      args:
        JAR: api.jar
    environment:
      <<: *telemetry
      SPRING_DATASOURCE_URL: jdbc:postgresql://toxiproxy:15432/placemap?sslmode=disable&ApplicationName=api
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: load
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "10"     # a local database never scales to zero
      PLACEMAP_ROUTING_ENGINE: valhalla
      PLACEMAP_VALHALLA_URL: http://toxiproxy:18002
      PLACEMAP_NEARBY_TRAVELTIMETIMEOUT: 800ms       # the plan's value for an engine on the same network
      PLACEMAP_LIVE_URL: http://live-hub:8081
      PLACEMAP_SEARCH_PHOTONURL: http://photon:8080/api/
    mem_limit: 768m
    cpuset: ${PLACEMAP_SUT_CPUS}
    ulimits:
      nofile: 65536                        # L10 holds 2,000 slow connections
    ports:
      - "127.0.0.1:58080:8080"
    depends_on:
      postgis: {condition: service_healthy}
      valhalla: {condition: service_healthy}
      toxiproxy: {condition: service_started}
    healthcheck:
      # The JRE image has no curl or wget; bash speaks enough HTTP for this.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 2s
      retries: 60

  # The load generators, run one scenario at a time by tools/load-tests.py, on their own CPUs.
  k6:
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    profiles: [tools]
    mem_limit: 2g
    cpuset: ${PLACEMAP_LOAD_CPUS}
    volumes:
      - ../../load/k6:/scripts:ro
      - ${PLACEMAP_RUN_DIR:-../../target/load/none}:/work     # origins in, summaries out
    environment:
      API: http://api:8080
      LIVE: http://live-hub:8081
      WORK: /work
      K6_NO_USAGE_REPORT: "true"                # k6 otherwise reports each run to Grafana
      K6_AUTO_EXTENSION_RESOLUTION: "false"     # and could download extensions
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
      # Tags that become labels in Prometheus: never the URL, which holds a different origin each time.
      K6_SYSTEM_TAGS: status,method,scenario,expected_response,check,error_code

  # Holds thousands of live-hub streams open and measures their lag (L6-L8, C5).
  sse-client:
    image: placemap/sse-idle-client:load
    build:
      context: ../../load/sse-idle-client/target
      dockerfile: ../../../infra/docker/java-service/Dockerfile
      args:
        JAR: sse-idle-client.jar
    profiles: [tools]
    mem_limit: 1g
    cpuset: ${PLACEMAP_LOAD_CPUS}
    ulimits:
      nofile: 65536
    volumes:
      - ${PLACEMAP_RUN_DIR:-../../target/load/none}:/work

  # Slowloris against the api (L10).
  slowhttptest:
    image: placemap/slowhttptest:load
    build: ../docker/slowhttptest
    profiles: [tools]
    mem_limit: 512m
    cpuset: ${PLACEMAP_LOAD_CPUS}
    ulimits:
      nofile: 65536
    volumes:
      - ${PLACEMAP_RUN_DIR:-../../target/load/none}:/work

volumes:
  db:
  prometheus:
