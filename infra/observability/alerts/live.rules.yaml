# Alert rules for live-hub, in Prometheus rule-file format. In development, tools/grafana-apply.py imports them into
# Grafana as Grafana-managed rules.
#
# Benchmark runs (deployment_environment="benchmark") cut feeds on purpose, so they never alert.
#
# Departures are read only while someone is looking, so their topic is stale whenever nobody is: it is
# left out.
groups:
  - name: placemap-live
    rules:
      - alert: LiveFeedStale
        expr: >-
          max by (topic) (placemap_live_feed_stale{job="placemap/live-hub", topic!="departures",
                                                   deployment_environment!="benchmark"}) > 0
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "the live {{ $labels.topic }} feed is stale"
          description: "live-hub has had no answer from the {{ $labels.topic }} feed for over 3x its ttl, for 2 minutes. The map marks that data out of date and keeps showing the last values."
