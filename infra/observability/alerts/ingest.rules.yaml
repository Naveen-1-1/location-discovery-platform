# Alert rules for the importer, in Prometheus rule-file format. Development uses the same rules as Grafana-managed
# rules (infra/observability/grafana/alerting/placemap-ingest.rules.json, applied by tools/grafana-apply.py).
#
# A one-off run (tools/dev.sh ingest-once) exports its counters once, at exit, so increase() never sees them change.
# Each rule therefore also fires for a series that is new in the window and already above zero.
groups:
  - name: placemap-ingest
    rules:
      - alert: IngestRunFailed
        expr: >-
          sum by (source) (
            (increase(placemap_ingest_runs_total{job="placemap/ingest", outcome="failed"}[15m]) > 0)
            or (max_over_time(placemap_ingest_runs_total{job="placemap/ingest", outcome="failed"}[15m]) > 0
                unless max_over_time(placemap_ingest_runs_total{job="placemap/ingest", outcome="failed"}[15m] offset 15m))
          ) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "the {{ $labels.source }} import failed"
          description: "A bad download, a safety limit, or too many attempts. The map keeps the last good import; the reason is in ingest.run.error."
          runbook_url: "https://github.com/Naveen-1-1/place-discovery-map/blob/main/docs/runbooks/ingest-run-failed.md"
      - alert: IngestSafetyLimitTripped
        expr: >-
          sum by (source, limit) (
            (increase(placemap_ingest_limit_trips_total{job="placemap/ingest"}[15m]) > 0)
            or (max_over_time(placemap_ingest_limit_trips_total{job="placemap/ingest"}[15m]) > 0
                unless max_over_time(placemap_ingest_limit_trips_total{job="placemap/ingest"}[15m] offset 15m))
          ) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "the {{ $labels.limit }} limit stopped the {{ $labels.source }} import"
          description: "Too many rejected rows (over 2%) or records to retire (over 20%); nothing was retired. Check the source before re-running."
          runbook_url: "https://github.com/Naveen-1-1/place-discovery-map/blob/main/docs/runbooks/ingest-run-failed.md"
