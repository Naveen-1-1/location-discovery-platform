spring:
  application:
    name: api              # becomes OpenTelemetry service.name
  threads:
    virtual:
      enabled: true        # Tomcat request handling on virtual threads
  datasource:
    # Neon direct (non-pooled) endpoint from .env. verify-full checks the certificate and host name
    # against the JVM trust store.
    url: jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&ApplicationName=api
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:                    # bound straight onto HikariCP setters, so times are plain milliseconds
      maximum-pool-size: 10
      minimum-idle: 0            # idle connections are closed so Neon can scale to zero and save free compute hours
      idle-timeout: 60000        # 60 s
      max-lifetime: 300000       # 5 min
      connection-timeout: 10000  # 10 s: covers Neon's wake-up from zero (a few hundred ms)
  mvc:
    problemdetails:
      enabled: true          # errors as application/problem+json

server:
  port: 8080
  # Trust X-Forwarded-For only from proxies on loopback or private networks (Caddy in front), so rate
  # limits see each client instead of the proxy. A client on the internet cannot set it for itself.
  forward-headers-strategy: native
  tomcat:
    # A body nobody reads is swallowed to keep the connection open, at most this much; then the connection is closed.
    # The api reads no bodies at all: placemap.body-limit refuses them first.
    max-swallow-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health, info
  tracing:
    sampling:
      probability: 1.0       # development: keep every trace (Grafana Cloud free: 50 GB/month)
  opentelemetry:
    resource-attributes:
      "[service.namespace]": placemap
      "[deployment.environment]": ${PLACEMAP_ENV:dev}
  otlp:
    metrics:
      export:
        step: 30s
        base-time-unit: seconds   # Prometheus convention: *_seconds
        # One exponential histogram series instead of ~70 bucket series per label set: keeps us far under
        # Grafana Cloud's free 10k-series limit while still giving p95/p99.
        histogram-flavor: base2_exponential_bucket_histogram
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        # The in-flight (long-task) timer only needs its count: without this it inherits the prefix above and
        # exports ~30 classic bucket series.
        "[http.server.requests.active]": false
        # Calls to the routing engine: one exponential histogram per endpoint, as for incoming requests.
        "[http.client.requests]": true
        "[http.client.requests.active]": false
  # OTLP endpoints and auth come from OTEL_EXPORTER_OTLP_ENDPOINT / _HEADERS / _PROTOCOL in .env, which Spring Boot
  # maps onto its own properties for traces, metrics and logs.

logging:
  level:
    # The cache logs every failed load with a stack trace. Nearby counts overload rejections
    # (placemap.nearby.rejected) and logs real database errors itself.
    "[com.github.benmanes.caffeine.cache.LocalAsyncCache]": error

springdoc:
  api-docs:
    enabled: ${PLACEMAP_API_DOCS:false}   # /v3/api-docs, for generating the frontend's types; off unless asked for

jdbc:
  datasource-proxy:
    include-parameter-values: false   # keep coordinates out of trace attributes

placemap:
  drills:
    enabled: ${PLACEMAP_DRILLS:false}
  rate-limit:                    # per client, over the limit means 429
    per-second: 10
    burst: 20
  nearby:
    deadline: 1500ms
    # The plan's 800 ms is for a local Valhalla; openrouteservice is across the internet.
    travel-time-timeout: 1s
  directions:                    # routes and isochrones: asked for on purpose, so they may take a few seconds
    deadline: 6s
    timeout: 5s
  live:                          # live-hub: nearby answers without live data after 150 ms
    url: ${PLACEMAP_LIVE_URL:http://localhost:8081}
    timeout: 150ms
  routing:
    engine: ${PLACEMAP_ROUTING_ENGINE:ors}   # ors, or valhalla: our own engine (the load-test stack)
    valhalla:
      base-url: ${PLACEMAP_VALHALLA_URL:http://localhost:8002}
    ors:
      api-key: ${ORS_API_KEY:}   # from .env; empty means straight-line distances only
      matrix-timeout: 1s         # a backstop: nearby enforces travel-time-timeout itself
      timeout: 5s

# Overload protection (plan: fail fast). A full bulkhead refuses at once: waiting would only push a request past its
# deadline. Metrics come with each instance (resilience4j_*).
resilience4j:
  bulkhead:
    instances:
      routing:                   # calls to the engine in flight, shared by nearby, routes and isochrones
        max-concurrent-calls: 8
        max-wait-duration: 0
      database:                  # every database search, nearby and names: as many as the pool has connections
        max-concurrent-calls: 10
        max-wait-duration: 0
      photon:                    # address searches in flight; one more is answered without addresses
        max-concurrent-calls: 4
        max-wait-duration: 0
  circuitbreaker:
    instances:
      routing:                   # opens when half of at least 5 calls in the last 10 s failed; 2 trial calls after 10 s
        sliding-window-type: time_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        # "No route from here" is an answer, not a failure of the engine.
        ignore-exception-predicate: io.github.naveen11.placemap.api.routing.RoutingException$Unroutable
  timelimiter:
    instances:
      travel-times:              # the one travel-time call inside nearby's deadline
        timeout-duration: ${placemap.nearby.travel-time-timeout}
      directions:                # routes and isochrones
        timeout-duration: ${placemap.directions.timeout}
