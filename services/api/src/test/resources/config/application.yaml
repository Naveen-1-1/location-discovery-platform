# Loaded on top of src/main/resources/application.yaml (config/ wins). Tests never export telemetry and never
# call the real routing engine or live-hub.
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

placemap:
  live:
    url: ""
  routing:
    ors:
      api-key: ""
