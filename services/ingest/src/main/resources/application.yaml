spring:
  application:
    name: ingest           # becomes OpenTelemetry service.name
  main:
    web-application-type: none
  lifecycle:
    timeout-per-shutdown-phase: 30s   # covers the 20 s drain plus the cancel (placemap.ingest.shutdown-grace)
  datasource:
    # Neon direct (non-pooled) endpoint: session advisory locks need it. reWriteBatchedInserts turns each
    # batch's 1,000 single-row upserts into a few multi-row statements.
    url: jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&ApplicationName=ingest&reWriteBatchedInserts=true
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:                    # plain milliseconds
      # Per run: one connection for each of the 4 partitions while it writes, plus the lock's; 2 runs at once, plus
      # 2 for bookkeeping.
      maximum-pool-size: 12
      minimum-idle: 0            # let Neon scale to zero between runs
      idle-timeout: 60000
      max-lifetime: 300000       # in-use connections (like the lock's) are never retired mid-run
      connection-timeout: 10000
  batch:
    job:
      enabled: false             # the scheduler starts each import; nothing runs at start-up
    jdbc:
      table-prefix: batch.BATCH_ # Spring Batch's own tables, in their own schema
      initialize-schema: never   # a migration creates them
      # The source lock already keeps one run per source, so creating a job needs no serializable transaction (which
      # can fail when two sources start at once).
      isolation-level-for-create: read_committed

management:
  opentelemetry:
    resource-attributes:
      "[service.namespace]": placemap
      "[deployment.environment]": ${PLACEMAP_ENV:dev}
  otlp:
    metrics:
      export:
        step: 30s
        base-time-unit: seconds
        histogram-flavor: base2_exponential_bucket_histogram
  # OTLP endpoints and auth come from OTEL_EXPORTER_OTLP_* in .env, as for the api.

# placemap.ingest.* defaults are in IngestProperties.
