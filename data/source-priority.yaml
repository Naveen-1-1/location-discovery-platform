# Gate G1, decided with the project owner 2026-10-10, from the Phase 0 coverage count.
# existence: sources allowed to create a place (subject to the rules below).
# enrich:    sources that only attach details (licence, inspection, SNAP, hours…) to a matched place.

# Kinds of place a record may be matched across (owner decision 2026-10-11). A link or a borderline review
# needs the same category, one of these pairs, or a record with no category (most licences): a hospital is never held
# back by the library inside it, nor merged into the T stop named after it, while a deli licence still enriches the
# grocery store it is in.
compatible_categories:
  - [food, grocery]
  - [grocery, pharmacy]

overture_rule:
  exclude_operating_status: [permanently_closed]
  min_confidence_alone: 0.9             # at or above: may create a place on its own
  below_threshold_needs_corroboration:  # below: needs a nearby same-category record from another existence source
    radius_m: 100
    min_name_similarity: 0.85           # Jaro-Winkler on normalised names (the real matcher may refine)

categories:
  food:             { existence: [overture, osm],
                      enrich: [boston_active_food_licenses, boston_food_inspections, boston_licensing_board_licenses,
                               cambridge_food_establishment_permits, cambridge_sanitary_inspections] }
  grocery:          { existence: [overture, osm, boston_food_inspections, usda_snap_retailers],
                      enrich: [usda_snap_retailers] }   # SNAP acceptance flag
  pharmacy:         { existence: [osm, overture], enrich: [nppes_npi_pharmacies],
                      overture_requires_corroboration_by: [osm, nppes_npi_pharmacies] }   # ~20% of Overture "pharmacies" are drug companies
  gym:              { existence: [overture, osm] }
  atm:              { existence: [overture, osm] }
  park:             { existence: [osm, boston_open_space], enrich: [overture, boston_park_features] }   # polygons decide
  bank:             { existence: [fdic_bank_locations, overture, osm],
                      names_from: [overture, osm],   # the name on the door ("Chase Bank"), not FDIC's legal one
                      note: "FDIC is authoritative for bank branches; Overture/OSM add credit unions" }
  ev_charging:      { existence: [afdc_alt_fuel_stations] }        # 1,320 public vs OSM 49 / Overture 38
  bike_share:       { existence: [bluebikes_station_information] } # display-only
  transit:          { existence: [mbta_gtfs] }                     # display-only
  library:          { existence: [overture, osm], enrich: [boston_public_libraries] }
  hospital:         { existence: [massgis_hospitals], enrich: [osm, overture] }   # Overture "hospital" = departments
  community_centre: { existence: [overture, osm, boston_bcyf_community_centers] }
  wifi:             { existence: [boston_wicked_free_wifi] }       # one place per site
