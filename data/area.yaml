# Coverage area (ADR 0005). Add a town here and re-run tools/fetch-area.sh to extend coverage.
# Boundaries: MassGIS "Massachusetts Municipalities" (survey-based polygons, include water/harbor islands).
boundary_source:
  publisher: MassGIS (Bureau of Geographic Information)
  layer: https://services1.arcgis.com/hGdibHYSPO59RG1h/arcgis/rest/services/Massachusetts_Municipalities/FeatureServer/1
  name_field: TOWN
  native_crs: EPSG:26986
towns:
  - BOSTON
  - CAMBRIDGE
  - SOMERVILLE
  - BROOKLINE
# Buffer used when cutting extracts (OSM, Overture) so places just across a boundary can still be routed to.
extract_buffer_m: 500
generated:
  polygons: data/area/area.geojson   # EPSG:4326, one feature per town, written by tools/fetch-area.sh
# Street ZIP codes of the four towns, for sources that can only be searched by ZIP (NPPES pharmacies). PO-box-only
# codes are left out. 02467 (Chestnut Hill) is shared with Newton; the area polygon decides after geocoding.
postcodes:
  boston: ["02108", "02109", "02110", "02111", "02113", "02114", "02115", "02116", "02118", "02119", "02120", "02121",
           "02122", "02124", "02125", "02126", "02127", "02128", "02129", "02130", "02131", "02132", "02134", "02135",
           "02136", "02163", "02199", "02201", "02203", "02210", "02215", "02467"]
  cambridge: ["02138", "02139", "02140", "02141", "02142"]
  somerville: ["02143", "02144", "02145"]
  brookline: ["02445", "02446", "02447", "02467"]
