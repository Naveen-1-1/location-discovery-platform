      method: sse               # same host also serves REST JSON:API; streaming uses Accept: text/event-stream
      url: https://api-v3.mbta.com
      api_key_env: MBTA_API_KEY
      rate_limit: "1,000 requests/min with key (documented); 20/min without key (x-ratelimit-limit: 20 observed); streaming requires a key"
    cadence: realtime
