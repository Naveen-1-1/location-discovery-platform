    cadence: daily              # data.gov NTAD record lists daily updates
    crs: EPSG:4326
    join_keys: [id]
    licence: custom
    licence_url: https://developer.nlr.gov/terms/
    redistribution: "yes"
    attribution: null
    licence_notes: >-
      NLR Developer Network Terms: the Data "may be used for any purpose
      whatsoever". No attribution is required. The DOE/NLR/Alliance names must
      not be used to endorse or promote anyone using the data. The user must
      indemnify DOE/NLR against claims arising from "use and distribution of the
      Data", which assumes we will distribute it; flag that clause for legal
      review. Optional courtesy credit: "U.S. DOE Alternative Fuels Data Center".
    verified: 2026-10-10

