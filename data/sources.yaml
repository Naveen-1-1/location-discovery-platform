# data/sources.yaml - data-source registry for the Boston place-discovery map
#
# NOT LEGAL ADVICE. This is a factual licence audit compiled on 2026-10-10 from
# each publisher's own licence / terms-of-use pages and catalogue metadata. It
# records what those pages say and how we read them for one purpose: deciding
# whether a source may be REDISTRIBUTED inside our open place-data release
# (OSM + Overture + official data merged into one place table published under
# ODbL-1.0 with attribution). Have counsel review before the first release, and
# re-check terms whenever `verified` is more than ~6 months old.
#
# redistribution values (always quoted, because YAML 1.1 parsers read a bare
# yes as boolean true):
#   "yes"          - terms permit including the data in the ODbL release,
#                    subject to the attribution / notice duties listed.
#   "display-only" - may be shown in the app but must not be redistributed.
#   "unknown"      - terms are unclear or may conflict with ODbL. Keep the data
#                    out of the release until the publisher clarifies.
#                    Notes say whether in-app display is clearly allowed.
#
# Fields added by owner decisions (2026-10-10):
#   decision     - ADR that settled how this source is used.
#   enabled      - false = not imported at all (default true).
#   drop_fields  - personal fields the importer discards before storing anything (ADR 0031).
# CI rule: every enabled source must be "yes" or "display-only".
#
# Quotations in licence_notes are short excerpts (<= 25 words per source).
# Fetch caveats on 2026-10-10: mass.gov and fns.usda.gov pages returned HTTP 403
# to automated fetches. MassGIS terms were read from MassGIS-owned ArcGIS Online
# item metadata (fetched directly) and a search-index copy of the MassGIS FAQ.
# WIC/HIP terms were read from search-index copies only. Re-check those manually.

sources:

  # ---------------------------------------------------------------- base layers
  - id: osm_geofabrik_massachusetts
    name: OpenStreetMap - Massachusetts extract
    publisher: OpenStreetMap contributors (extract by Geofabrik GmbH)
    category_scope: [all]
    role: existence
    access:
      method: osm_pbf
      url: https://download.geofabrik.de/north-america/us/massachusetts-latest.osm.pbf
      api_key_env: null
      rate_limit: null          # none documented; file ~296 MB, so fetch at most once a day
    cadence: weekly             # plan: weekly (~296 MB per download); Geofabrik refreshes daily (2026-10-10 file: data to 2026-10-08T20:21Z)
    crs: EPSG:4326
    join_keys: [osm_type, osm_id]
    licence: ODbL-1.0
    licence_url: https://www.openstreetmap.org/copyright
    redistribution: "yes"
    attribution: "© OpenStreetMap contributors"
    licence_notes: >-
      openstreetmap.org/copyright: "you may distribute the result only under the
      same license". Share-alike is met because the merged table is itself
      ODbL-1.0. Geofabrik's footer labels the extract ODbL 1.0. The OSMF
      Attribution Guidelines treat "© OpenStreetMap contributors" as an
      acceptable historical form; the preferred form is "OpenStreetMap" linked
      to openstreetmap.org/copyright. For a database release, put the
      attribution plus the ODbL text or a link to it in the README/metadata.
    verified: 2026-10-10

  - id: overture_places
    name: Overture Maps Places (release 2026-09-23.1)
    publisher: Overture Maps Foundation
    category_scope: [all]
    role: existence
    access:
      method: geoparquet_s3
      url: s3://overturemaps-us-west-2/release/2026-09-23.1/theme=places/type=place/
      api_key_env: null         # public bucket, anonymous (unsigned) reads
      rate_limit: null
    cadence: monthly
    crs: EPSG:4326
    join_keys: [id, sources.record_id]   # id = GERS id; sources[].dataset gives the per-record upstream
    licence: [CDLA-Permissive-2.0, Apache-2.0, CC0-1.0]   # varies per record, see sources[].dataset
    licence_url: https://docs.overturemaps.org/attribution/
    redistribution: "yes"
    attribution: |-
      Overture Maps Foundation, overturemaps.org
      Data from Meta. Data from Microsoft. Data from PinMeTo. Data from Krick. Data from RenderSEO. Data from DAC. Data from BrightQuery. (CDLA Permissive 2.0)
      Data from Foursquare. Copyright 2024 Foursquare Labs, Inc. All rights reserved. Available under Apache 2.0. Foursquare data was transformed to the Overture schema. Changed: 2026-03-18. [plus the full Foursquare NOTICE.txt]
      Data from AllThePlaces. (CC0 1.0)
    licence_notes: >-
      The attribution page lists licences per Places provider: CDLA-Permissive-2.0
      (Meta, Microsoft, PinMeTo, Krick, RenderSEO, DAC, BrightQuery), Apache-2.0
      (Foursquare) and CC0-1.0 (AllThePlaces). CDLA-P-2.0 §2.1 allows sharing "so
      long as the Data Recipient makes available the text of this agreement with
      the shared Data", so ship the CDLA text. Apache-2.0 for Foursquare: ship the
      LICENSE file, the full NOTICE.txt (https://opensource.foursquare.com/places-notice-txt/)
      and a notice of our own changes. NOTICE.txt currently reads "© 2026" but
      the Overture page says "Copyright 2024", so reproduce NOTICE.txt word for
      word. All three licences are permissive enough to include in an ODbL
      database. Drop attribution lines for providers absent from our extract.
      Overture presents its own citation line as optional.
    verified: 2026-10-10

