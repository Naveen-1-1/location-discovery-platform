  # ------------------------------------------------------------- MBTA / MassDOT
  - id: mbta_gtfs
    name: MBTA GTFS (static schedule, stops, stations)
    publisher: Massachusetts Bay Transportation Authority (MassDOT)
    category_scope: [transit]
    role: existence
    access:
      method: gtfs
      url: https://cdn.mbta.com/MBTA_GTFS.zip
      api_key_env: null
      rate_limit: null
    cadence: weekly             # MBTA: "updated several times per month"
    crs: EPSG:4326
    join_keys: [stop_id, parent_station]
    licence: custom
    licence_url: https://cdn.mbta.com/sites/default/files/2023-08/mbta-massdot-develop-license-agreement.pdf
    redistribution: "display-only"
    decision: "ADR 0029: shown in the app, excluded from the ODbL download"
    attribution: "Data provided by MassDOT / MBTA"   # our wording; the licence only requires clear acknowledgement
    licence_notes: >-
      MassDOT Developers License Agreement (updated 2009-11-13) §3.1 grants
      "non-exclusive, limited, and revocable rights to use, reproduce, and
      redistribute the Data". §4.1: acknowledge MassDOT, never claim ownership,
      no logos. §4.2 allows combining with other data. §5.1 allows changing the
      terms without notice. The grant is revocable, says nothing on
      sublicensing, and binds each user directly, so it is unclear whether stops
      can be relicensed under ODbL's perpetual terms. In-app display with
      acknowledgement is clearly allowed. Keep out of the ODbL release until
      MassDOT confirms.
    verified: 2026-10-10

  - id: mbta_gtfs_rt
    name: MBTA GTFS-Realtime feeds
    publisher: Massachusetts Bay Transportation Authority (MassDOT)
    category_scope: [transit]
    role: live
    access:
      method: gtfs_rt
      url: https://cdn.mbta.com/realtime/
      # feeds: VehiclePositions.pb, TripUpdates.pb, Alerts.pb (all HTTP 200 on 2026-10-10)
      api_key_env: null
      rate_limit: null
    cadence: realtime
    crs: EPSG:4326
    join_keys: [trip_id, route_id, stop_id, vehicle_id]
    licence: custom
    licence_url: https://cdn.mbta.com/sites/default/files/2023-08/mbta-massdot-develop-license-agreement.pdf
    redistribution: "display-only"
    decision: "ADR 0029: shown in the app, excluded from the ODbL download"
    attribution: "Data provided by MassDOT / MBTA"   # our wording
    licence_notes: >-
      Same MassDOT Developers License Agreement as mbta_gtfs: a revocable right
      to "use, reproduce, and redistribute" with acknowledgement of MassDOT.
      Live data is shown in the app only and is never part of the static ODbL
      release. The ODbL question is as unclear as for mbta_gtfs.
    verified: 2026-10-10

  - id: mbta_v3_api
    name: MBTA V3 API (JSON:API + SSE streaming)
    publisher: Massachusetts Bay Transportation Authority (MassDOT)
    category_scope: [transit]
