      method: rest_api
      url: https://api.fdic.gov/banks/locations   # e.g. ?filters=STALP:MA&format=json
      api_key_env: null         # docs: users "currently not required to register" for a key
      rate_limit: "not documented; response header x-ratelimit-limit: 20 observed (window unstated)"
    cadence: daily              # API index rebuilt daily (meta.index.name locations_20261009...)
    crs: EPSG:4326              # LATITUDE / LONGITUDE
    join_keys: [UNINUM, CERT]
    licence: US-Gov-Public-Domain
    licence_url: https://www.usa.gov/publicdomain/label/1.0/
    redistribution: "yes"
    attribution: null
    licence_notes: >-
      The data.gov record "FDIC Bank Locations" gives the licence as
      usa.gov/publicdomain/label/1.0 and lists this API plus a bulk CSV. FDIC
      Website Policies: the FDIC "makes all non-sensitive agency information
      available to the public". The API docs set no attribution or reuse terms;
      the site disclaims warranty only.
    verified: 2026-10-10

  - id: afdc_alt_fuel_stations
