  # ------------------------------------------------------------ federal sources
  - id: usda_snap_retailers
    name: SNAP Retailer Locations
    publisher: USDA Food and Nutrition Service (ArcGIS owner FNS_SNAP_RPMD)
    category_scope: [grocery, convenience, farmers_market]
    role: enrich
    access:
      method: arcgis_rest
      url: https://services1.arcgis.com/RLQu0rK7h4kbsBq5/arcgis/rest/services/snap_retailer_location_data/FeatureServer/0
      api_key_env: null
      rate_limit: "no rate limit documented; maxRecordCount 1000 per page"
    cadence: weekly             # the item description says "updated every 2 weeks"; poll weekly
    crs: EPSG:4326              # use the Latitude/Longitude attributes or outSR=4326 (layer geometry is EPSG:3857)
    join_keys: [Record_ID]
    licence: CC-BY-4.0
    licence_url: https://catalog.data.gov/dataset/snap-retail-locator
    redistribution: "yes"
    attribution: "Source: USDA Food and Nutrition Service, SNAP Retailer Locator data, CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/); modified"
    licence_notes: >-
      The data.gov record "SNAP Retail Locator" (USDA-FNS-000011) has License
      https://creativecommons.org/licenses/by/4.0. The ArcGIS item's licenseInfo
      is empty, and the FNS data page blocked automated fetch (403), so we found
      no other FNS terms. CC BY 4.0 lets us share adapted data under our own ODbL
      licence if we keep the attribution, link the licence and note our changes.
      Federal works are usually public domain (17 USC 105), so treating the data
      as CC BY is the cautious choice. The Incentive_Program field does not mark
      MA HIP vendors (only 8 MA rows, all "Waiver").
    verified: 2026-10-10

  - id: nppes_npi_pharmacies
    name: NPPES NPI Registry API - community/retail pharmacies
    publisher: Centers for Medicare & Medicaid Services (HHS)
    category_scope: [pharmacy]
    role: enrich
    access:
      method: rest_api
      url: https://npiregistry.cms.hhs.gov/api/?version=2.1
      # e.g. &taxonomy_description=Community/Retail Pharmacy&state=MA&postal_code=021*
      # then keep taxonomies[].code == 3336C0003X and addresses[].address_purpose == LOCATION
      # (city/state filters also match MAILING addresses)
      api_key_env: null
      rate_limit: "no rate limit documented; max 200 results per request and skip <= 1000 (1,200 records per query), so partition by postal_code"
    cadence: daily              # registry: "Information associated with NPIs is updated daily"
    crs: none (needs geocoding)
    join_keys: [number]         # the NPI
    # ADR 0031: the API returns each organisation's authorised official; the importer never writes them anywhere.
    drop_fields: [authorized_official_first_name, authorized_official_middle_name, authorized_official_last_name,
                  authorized_official_name_prefix, authorized_official_name_suffix, authorized_official_credential,
                  authorized_official_title_or_position, authorized_official_telephone_number]
    licence: US-Gov-Public-Domain
    licence_url: https://www.cms.gov/medicare/regulations-guidance/administrative-simplification/data-dissemination
    redistribution: "yes"
    attribution: null
    licence_notes: >-
      There is no dataset licence. Under notice CMS-6060-N (72 FR 30011, 2007)
      the published fields are "required to be disclosed under the FOIA", and
      we found no reuse restriction. CMS says of cms.gov: "It is a public domain
      web site." Reading these as redistributable federal FOIA records is our
      inference, not an explicit grant. Use NPI-2 (organisation) records only.
      CMS suggests showing only the NPI and deactivation date for deactivated NPIs.
    verified: 2026-10-10

