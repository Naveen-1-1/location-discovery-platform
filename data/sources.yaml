    join_keys: [stop_id, route_id, trip_id]
    licence: custom
    licence_url: https://cdn.mbta.com/sites/default/files/2023-08/mbta-massdot-develop-license-agreement.pdf
    redistribution: "display-only"
    decision: "ADR 0029: shown in the app, excluded from the ODbL download"
    attribution: "Data provided by MassDOT / MBTA"   # our wording
    licence_notes: >-
      The V3 API page says data use is governed by the MassDOT Developers
      License Agreement, the same terms as mbta_gtfs. mbta.com's general Terms
      of Use bar redistributing "Platform Content", but the developer licence is
      the specific grant for this data. In-app display is allowed; the ODbL
      release question is unclear.
    verified: 2026-10-10

  # ------------------------------------------------------------------ Bluebikes
  - id: bluebikes_station_information
    name: Bluebikes GBFS - station_information
    publisher: Lyft Bikes and Scooters, LLC (operator); data owned by Boston, Cambridge, Brookline, Everett and Somerville
    category_scope: [bike_share]
    role: existence
    access:
      method: gbfs
      url: https://gbfs.bluebikes.com/gbfs/en/station_information.json
      # discovery: https://gbfs.bluebikes.com/gbfs/gbfs.json (GBFS 1.1; also lists gbfs.lyft.com/gbfs/1.1/bos/... URLs)
      api_key_env: null
      rate_limit: null          # ttl 60 s; no limit documented
    cadence: daily              # station list changes rarely; poll daily (626 stations on 2026-10-10)
    crs: EPSG:4326
    join_keys: [station_id, short_name, legacy_id]
    licence: custom
    licence_url: https://bluebikes.com/data-license-agreement
    redistribution: "display-only"
    decision: "ADR 0029: shown in the app, excluded from the ODbL download"
    attribution: null
    licence_notes: >-
      Data License Agreement (2021-01-22) §1 grants a perpetual licence to
      "distribute in your product or service". §2(b) bars any user from
      "Host, stream, publish, distribute, sublicense, or sell the Data as a
      stand-alone dataset", except in non-commercial analyses. §2(g)-(h): no
      implied endorsement, no Bluebikes marks without permission. §7: Lyft can
      terminate at any time. In-app display is allowed. An ODbL release would
      let others extract and re-share stations on their own, so compatibility
      is unclear; ask bike-data@lyft.com. The feed has no license_url; the
      system-data page links this agreement. Possible PDDL alternative for
      Boston only: Analyze Boston "blue-bike-stations" (not audited).
    verified: 2026-10-10

  - id: bluebikes_station_status
    name: Bluebikes GBFS - station_status
    publisher: Lyft Bikes and Scooters, LLC (operator); data owned by Boston, Cambridge, Brookline, Everett and Somerville
    category_scope: [bike_share]
    role: live
    access:
      method: gbfs
      url: https://gbfs.bluebikes.com/gbfs/en/station_status.json
      api_key_env: null
      rate_limit: null          # ttl 60 s
    cadence: realtime
    crs: none (needs geocoding)   # status has no coordinates; join to station_information
    join_keys: [station_id]
    licence: custom
    licence_url: https://bluebikes.com/data-license-agreement
    redistribution: "display-only"
    decision: "ADR 0029: shown in the app, excluded from the ODbL download"
    attribution: null
    licence_notes: >-
      Same Data License Agreement as bluebikes_station_information. §2(b) also
      bars re-streaming the Data as a stand-alone dataset. Showing live
      availability in the app is allowed ("distribute in your product or
      service"). Live data is never in the static release.
    verified: 2026-10-10

