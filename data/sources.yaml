    publisher: MassGIS (Bureau of Geographic Information, EOTSS), with data from Mass. DPH / CHIA
    category_scope: [hospital]
    role: existence             # DPH-licensed hospitals; 103 features on 2026-10-10
    access:
      method: arcgis_rest
      url: https://arcgisserver.digital.mass.gov/arcgisserver/rest/services/AGOL/Hospitals/FeatureServer/0
      # shapefile: https://s3.us-east-1.amazonaws.com/download.massgis.digital.mass.gov/shapefiles/state/hospitals.zip (Last-Modified 2026-08-21)
      # the older acute_care_hospitals.zip (2024-09) layer is deprecated
      api_key_env: null
      rate_limit: "no rate limit documented; maxRecordCount 2000"
    cadence: quarterly          # updated irregularly when DPH sends changes; poll quarterly
    crs: EPSG:4326              # requested with outSR=4326; the layer itself is EPSG:26986
    join_keys: [DPH_FACILITY_ID, MAD_ID]
    licence: custom
    licence_url: https://www.mass.gov/info-details/massgis-frequently-asked-questions
    redistribution: "yes"
    attribution: "MassGIS (Bureau of Geographic Information), Commonwealth of Massachusetts EOTSS"
    licence_notes: >-
      The licenseInfo on MassGIS's ArcGIS item 023af07d0458402b8de15fe733759a2f
      says the service "may be used by anyone for their purposes" and the data
      are public records. It asks that source credit "should be stated" in the
      form above, and disclaims liability. The MassGIS FAQ calls MassGIS data
      public domain because it is tax-funded; we read it via a search-index copy
      because mass.gov returned 403. Credit is a request, not a condition, but
      include it.
    verified: 2026-10-10

