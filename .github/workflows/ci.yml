name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + unit + Lincheck + JCStress (sanity)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install osmium (the OSM importer's tests run it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: JCStress (sanity mode; the full suite runs in nightly.yml)
        run: |
          ./mvnw -B -ntp -pl libs/concurrent-jcstress -am verify -Pjcstress -Djcstress.mode=sanity -DskipTests \
            | tee jcstress.log
          # JCStress exits 0 even when tests fail; its last results line says how many did.
          python3 - jcstress.log <<'PY'
          import re, sys
          found = re.findall(r"Results: (\d+) planned; (\d+) passed, (\d+) failed, (\d+) soft errs, (\d+) hard errs",
                             open(sys.argv[1], encoding="utf-8", errors="replace").read())
          if not found or found[-1][2:] != ("0", "0", "0"):
              sys.exit("JCStress: " + (" ".join(found[-1]) if found else "no results line"))
          print("JCStress: %s of %s passed" % (found[-1][1], found[-1][0]))
          PY

      - name: Upload JCStress report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jcstress-report
          path: libs/concurrent-jcstress/target/results/
          if-no-files-found: ignore
