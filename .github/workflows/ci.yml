name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # with pipefail: a failing command fails its step even when piped

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + unit + Lincheck + JCStress (sanity)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          osmium: 'true'   # the OSM importer's tests run it

      # Testcontainers' "disabledWithoutDocker" is turned off, so a container test fails rather than skips.
      - name: Build and test, container tests included
        run: >-
          ./mvnw -B verify
          -Djunit.jupiter.conditions.deactivate=org.testcontainers.junit.jupiter.TestcontainersExtension

      - name: JCStress (sanity mode; the full suite runs in nightly.yml)
        run: |
          ./mvnw -B -pl libs/concurrent-jcstress -am verify -Pjcstress -Djcstress.mode=sanity -DskipTests \
            | tee jcstress.log
          # JCStress exits 0 even when tests fail; its last results line says how many did.
          python3 - jcstress.log <<'PY'
          import re, sys
          found = re.findall(r"Results: (\d+) planned; (\d+) passed, (\d+) failed, (\d+) soft errs, (\d+) hard errs",
                             open(sys.argv[1], encoding="utf-8", errors="replace").read())
          if not found or found[-1][2:] != ("0", "0", "0"):
              sys.exit("JCStress: " + (" ".join(found[-1]) if found else "no results line"))
          print("JCStress: %s of %s passed" % (found[-1][1], found[-1][0]))
          PY

      - name: Upload JCStress report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jcstress-report
          path: libs/concurrent-jcstress/target/results/
          if-no-files-found: ignore
