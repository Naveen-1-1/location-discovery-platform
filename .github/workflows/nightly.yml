name: nightly

# Phase 7's nightly check on GitHub: the steps of tools/dev.sh nightly, one job each, so they run side by side.
# The full ./mvnw verify, container tests included, runs in ci.yml on every push. The source contract tests run in
# contracts-nightly.yml. The release check needs the owner's local release (built from Neon), so it runs only in the
# local command. The load and crash tests L1–L10 and C3–C6 run in load-nightly.yml.
on:
  schedule:
    - cron: '41 5 * * *'   # 05:41 UTC daily
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  alerts:
    name: alert rules (promtool)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The promtool of the Prometheus image the load-test stack pins (one version to update, by Dependabot).
      - name: Copy promtool out of the load-test stack's Prometheus image
        run: |
          image=$(PLACEMAP_SUT_CPUS=0 PLACEMAP_LOAD_CPUS=0 docker compose -f infra/compose/load.compose.yaml config \
                  --images | grep '^prom/prometheus:')
          docker create --name promtool "$image"
          sudo docker cp promtool:/bin/promtool /usr/local/bin/promtool
          docker rm promtool

      - run: python3 tools/nightly.py --only promtool --no-history

  frontend:
    name: frontend typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: python3 tools/nightly.py --only frontend --no-history

  jcstress:
    name: full JCStress suite
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Reads JCStress's own results line: its exit code does not always report failed tests.
      - run: python3 tools/nightly.py --only jcstress --no-history

      - name: Upload the JCStress report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jcstress-report-full
          path: libs/concurrent-jcstress/target/results/
          if-no-files-found: ignore

  crash:
    name: crash tests C1 and C2
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          osmium: 'true'   # importing OSM to make its snapshot

      - name: Week (the input snapshots are made once a week)
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # The trials need saved OSM and Overture snapshots; without them, --fetch-snapshots imports each source once
      # into the throwaway database (a ~300 MB OSM download), and this cache keeps them for the week.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw/osm_geofabrik_massachusetts
            data/raw/overture_places
          key: proof-snapshots-${{ steps.week.outputs.week }}

      - name: Build the importer
        run: ./mvnw -B -pl services/ingest -am package -DskipTests

      - run: python3 tools/nightly.py --only c1,c2 --no-history --fetch-snapshots

      - name: Upload the trial logs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-tests
          path: |
            target/nightly/
            services/ingest/target/proofs/*.json
            services/ingest/target/proofs/*/*/*.log
          if-no-files-found: ignore
