version: 2
# Every ecosystem waits 14 days after a release before proposing it: the project pins the newest release that is at
# least 14 days old. Security updates are not held back by the cooldown.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /infra/docker/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
